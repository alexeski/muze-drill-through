<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muze Drill-Through Demo</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --border: #e3e6eb;
      --accent: #2359d1;
      --accent-soft: #eaf0fc;
      --code-bg: #f3f4f6;
      --warn: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 16px; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 16px;
      padding: 16px;
      height: calc(100vh - 62px);
    }
    .chart-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    /* Breadcrumb above the chart */
    nav.crumbs {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
    }
    nav.crumbs button {
      border: 0;
      background: none;
      color: var(--accent);
      padding: 0;
      font: inherit;
      cursor: pointer;
    }
    nav.crumbs .sep { color: var(--muted); }
    nav.crumbs .current { font-weight: 600; }

    /* The embedded ThoughtSpot charts */
    #stage {
      position: relative;
      flex: 1;
      min-height: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .embed { position: absolute; inset: 0; }
    .embed[hidden] { display: none; }

    /* The actions menu, laid over the chart's top-right corner */
    .action-menu {
      position: absolute;
      top: 44px; /* below the ThoughtSpot tile header */
      right: 12px;
      z-index: 2;
      width: 280px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 6px 24px rgba(16, 24, 40, .14);
      font-size: 13px;
      overflow: hidden;
    }
    .action-menu[hidden] { display: none; }
    .menu-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .menu-head dl {
      flex: 1;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2px 10px;
      margin: 0;
    }
    .menu-head dt { color: var(--muted); }
    .menu-head dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .menu-close {
      border: 0;
      background: none;
      padding: 0 2px;
      font-size: 18px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      background: none;
      font: inherit;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .menu-item:hover, .menu-item:focus-visible { background: var(--accent-soft); outline: none; }
    .menu-item:disabled { color: var(--muted); background: none; cursor: default; }
    .menu-item .icon { color: var(--accent); }

    /* "How it works" panel */
    aside {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
    }
    aside h2 { margin: 0 0 4px; font-size: 15px; }
    aside > p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .step {
      display: grid;
      grid-template-columns: 26px 1fr;
      gap: 0 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: border-color .2s, background .2s;
    }
    .step.done { border-color: var(--accent); background: var(--accent-soft); }
    .step .num {
      grid-row: span 4;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 600;
      background: var(--border);
      color: var(--muted);
    }
    .step.done .num { background: var(--accent); color: #fff; }
    .step h3 { margin: 2px 0 2px; font-size: 14px; }
    .step p { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
    .step code, .step pre {
      font: 12px/1.4 ui-monospace, Menlo, monospace;
      background: var(--code-bg);
      border-radius: 4px;
    }
    .step code { display: block; padding: 4px 6px; overflow-wrap: anywhere; }
    .step .file { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .step pre {
      margin: 6px 0 0;
      padding: 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--panel);
      border: 1px dashed var(--accent);
    }
    .step pre:empty { display: none; }
    .warn { color: var(--warn); }
    .setup-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      text-align: center;
      color: var(--warn);
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; height: auto; }
      #stage { height: 480px; flex: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Muze Studio drill-through demo</h1>
    <p>Click a bar, pick an action from the menu, and the page swaps in a second chart filtered by that bar.</p>
  </header>
  <main>
    <div class="chart-column">
      <nav class="crumbs" id="crumbs"></nav>
      <div id="stage">
        <div id="action-menu" class="action-menu" hidden></div>
      </div>
    </div>
    <aside>
      <h2>How it works</h2>
      <p>Each step lights up as it happens, with the data that was actually exchanged.</p>
      <ol class="steps" id="steps"></ol>
    </aside>
  </main>

  <script type="module">
    import {
      init,
      AuthType,
      LiveboardEmbed,
      EmbedEvent,
      RuntimeFilterOp,
    } from "https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk@1.52.1/dist/tsembed.es.js";

    // =========================================================================
    // CONFIG: fill these in, or pass them as query-string parameters
    // (?tsHost=…&liveboardId=…&vizId=…&detailVizId=…&detailLiveboardId=…)
    // =========================================================================
    const params = new URLSearchParams(location.search);
    const TS_HOST = params.get("tsHost") || "https://your-instance.thoughtspot.cloud";
    const LIVEBOARD_ID = params.get("liveboardId") || "<liveboard-guid>";
    const CHARTS = {
      // The clickable Muze chart (muze/chart.js).
      overview: {
        liveboardId: LIVEBOARD_ID,
        vizId: params.get("vizId") || "<chart-viz-guid>",
        label: "Total sales by region",
      },
      // The chart to drill into (muze/detail-chart.js, or any other chart).
      detail: {
        liveboardId: params.get("detailLiveboardId") || LIVEBOARD_ID,
        vizId: params.get("detailVizId") || "<detail-viz-guid>",
        label: "detail chart",
      },
    };
    // Answer column name → model column name, only where they differ.
    const COLUMN_MAP = {};

    // =========================================================================
    // STEP 0: embed the clickable chart
    // =========================================================================
    init({
      thoughtSpotHost: TS_HOST,
      authType: AuthType.EmbeddedSSO, // reuse the browser's ThoughtSpot session
    });

    const stage = document.getElementById("stage");
    const embeds = {}; // "overview" | "detail" → { el, embed }

    function embedChart(key, runtimeFilters = []) {
      const el = document.createElement("div");
      el.className = "embed";
      stage.append(el);
      const embed = new LiveboardEmbed(el, {
        frameParams: { width: "100%", height: "100%" },
        liveboardId: CHARTS[key].liveboardId,
        vizId: CHARTS[key].vizId,
        runtimeFilters,
        // Required for Muze Studio charts: with the browser data cache on, they
        // render the previous load's data, so a new filter shows up one load late.
        enableLiveboardDataCache: false,
      });
      embed.on(EmbedEvent.Error, (e) => console.warn(`${key} embed error`, e));
      embed.render();
      embeds[key] = { el, embed };
    }

    function removeChart(key) {
      if (!embeds[key]) return;
      embeds[key].embed.destroy();
      embeds[key].el.remove();
      delete embeds[key];
    }

    // =========================================================================
    // STEPS 1 + 2: receive the click from the Muze chart, and check the sender
    // =========================================================================
    // The embed whose iframe the message came from (the Muze chart runs in a
    // frame nested inside ThoughtSpot's iframe), or null for anything else.
    function embedThatSent(source) {
      for (const [key, { el }] of Object.entries(embeds)) {
        const iframe = el.querySelector("iframe");
        for (let win = source; iframe && win; win = win.parent) {
          if (win === iframe.contentWindow) return key;
          if (win === win.parent) break;
        }
      }
      return null;
    }

    function isClickMessage(msg) {
      return msg?.type === "muze-mark-click" && msg.version === 1 &&
        msg.row && typeof msg.row === "object" &&
        Array.isArray(msg.fields) &&
        Object.values(msg.row).every(
          (v) => v === null || ["string", "number", "boolean"].includes(typeof v),
        );
    }

    let clicked = null; // { row, fields } of the bar the menu is open for

    window.addEventListener("message", (event) => {
      if (event.data?.type !== "muze-mark-click") return;
      const from = embedThatSent(event.source);
      if (from !== "overview" || !isClickMessage(event.data)) return;

      const { row, fields } = event.data;
      showStep(1, JSON.stringify(row, null, 2));
      showStep(2, `Sent from inside the "${CHARTS.overview.label}" embed\nOrigin: ${event.origin}`);
      clicked = { row, fields };
      openMenu();
    });

    // =========================================================================
    // STEP 3: show the actions menu over the chart
    // =========================================================================
    const menu = document.getElementById("action-menu");
    const numberFormat = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });

    // One "equals" filter per attribute of the clicked bar (measures and dates skipped).
    function filtersFor({ row, fields }) {
      return fields
        .filter((f) => f.type === "dimension" && f.subtype !== "temporal" && row[f.name] != null)
        .map((f) => ({
          columnName: COLUMN_MAP[f.name] || f.name,
          operator: RuntimeFilterOp.EQ,
          values: [row[f.name]],
        }));
    }

    function describe(filters) {
      return filters.map((f) => `${f.columnName} = ${f.values[0]}`).join(", ");
    }

    function openMenu() {
      const filters = filtersFor(clicked);

      const values = document.createElement("dl");
      for (const [field, value] of Object.entries(clicked.row)) {
        const dt = document.createElement("dt");
        dt.textContent = field;
        const dd = document.createElement("dd");
        dd.textContent = typeof value === "number" ? numberFormat.format(value) : String(value);
        values.append(dt, dd);
      }
      const close = document.createElement("button");
      close.className = "menu-close";
      close.textContent = "×";
      close.setAttribute("aria-label", "Close menu");
      close.addEventListener("click", closeMenu);
      const head = document.createElement("div");
      head.className = "menu-head";
      head.append(values, close);

      const item = document.createElement("button");
      item.className = "menu-item";
      item.disabled = filters.length === 0;
      item.innerHTML = '<span></span><span class="icon">→</span>';
      item.firstChild.textContent = `View ${CHARTS.detail.label} for ${describe(filters)}`;
      item.addEventListener("click", () => drillInto(filters));

      menu.replaceChildren(head, item);
      menu.hidden = false;
      showStep(3, `Menu opened for ${describe(filters)}`);
    }

    function closeMenu() {
      menu.hidden = true;
      clicked = null;
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMenu();
    });

    // =========================================================================
    // STEP 4: swap in the detail chart, filtered by the clicked bar
    // =========================================================================
    function drillInto(filters) {
      closeMenu();
      if (CHARTS.detail.vizId.startsWith("<")) {
        showStep(4, "Set detailVizId in the page URL to the detail chart's visualization ID.", true);
        return;
      }
      removeChart("detail");
      embeds.overview.el.hidden = true; // keep it loaded so "back" is instant
      embedChart("detail", filters);
      showStep(4, `runtimeFilters: ${JSON.stringify(filters, null, 2)}`);
      renderCrumbs(filters);
    }

    function goBack() {
      removeChart("detail");
      embeds.overview.el.hidden = false;
      resetSteps();
      renderCrumbs();
    }

    function renderCrumbs(filters) {
      const nav = document.getElementById("crumbs");
      if (!filters) {
        nav.innerHTML = '<span class="current"></span>';
        nav.firstChild.textContent = CHARTS.overview.label;
        return;
      }
      nav.innerHTML = '<button></button><span class="sep">›</span><span class="current"></span>';
      nav.children[0].textContent = `← ${CHARTS.overview.label}`;
      nav.children[0].addEventListener("click", goBack);
      nav.children[2].textContent = describe(filters);
    }

    // =========================================================================
    // "How it works" panel
    // =========================================================================
    const STEPS = [
      {
        title: "The Muze chart sends the click",
        text: "Code inside the chart sends the clicked bar's data up to this page.",
        code: 'window.top.postMessage({ type: "muze-mark-click", row }, origin)',
        file: "muze/chart.js, part 2",
      },
      {
        title: "This page checks who sent it",
        text: "It only accepts the message if it came from inside its own ThoughtSpot embed.",
        code: 'window.addEventListener("message", …)',
        file: "host/index.html, steps 1 + 2",
      },
      {
        title: "This page shows its own menu",
        text: "The menu is ordinary HTML on this page, laid over the chart's top-right corner.",
        code: "openMenu()",
        file: "host/index.html, step 3",
      },
      {
        title: "The detail chart opens, filtered",
        text: "The page embeds the second chart and passes the clicked value as a runtime filter.",
        code: "new LiveboardEmbed(el, { vizId, runtimeFilters })",
        file: "host/index.html, step 4",
      },
    ];

    function resetSteps() {
      const list = document.getElementById("steps");
      list.replaceChildren(...STEPS.map((step, i) => {
        const li = document.createElement("li");
        li.className = "step";
        li.innerHTML = '<span class="num"></span><h3></h3><p></p><div><code></code>' +
          '<div class="file"></div><pre></pre></div>';
        li.querySelector(".num").textContent = i + 1;
        li.querySelector("h3").textContent = step.title;
        li.querySelector("p").textContent = step.text;
        li.querySelector("code").textContent = step.code;
        li.querySelector(".file").textContent = step.file;
        return li;
      }));
    }

    function showStep(n, output, isWarning = false) {
      const li = document.getElementById("steps").children[n - 1];
      li.classList.add("done");
      const pre = li.querySelector("pre");
      pre.textContent = output;
      pre.classList.toggle("warn", isWarning);
      // A new click starts a new run: clear the later steps.
      if (n === 1) {
        for (const later of [...li.parentElement.children].slice(1)) {
          later.classList.remove("done");
          later.querySelector("pre").textContent = "";
        }
      }
    }

    resetSteps();
    renderCrumbs();
    if (TS_HOST.includes("your-instance") || CHARTS.overview.vizId.startsWith("<")) {
      const note = document.createElement("p");
      note.className = "setup-note";
      note.textContent = "Set tsHost, liveboardId and vizId (and detailVizId to drill) in the " +
        "page URL or in the CONFIG block of host/index.html. See the README.";
      stage.append(note);
    } else {
      embedChart("overview");
    }
  </script>
</body>
</html>
