<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muze Drill-Through Demo</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The solution: embed, receive clicks, show the menu, drill. -->
  <script type="module" src="drill-through.js"></script>
  <!-- Demo only: the "How it works" panel. Remove it and the solution still works. -->
  <script type="module" src="how-it-works.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>Muze Studio drill-through demo</h1>
      <p>Click a bar, pick an action from the menu, and the page swaps in a second chart filtered by that bar.</p>
    </div>
    <a class="poc-note" href="https://github.com/alexeski/muze-drill-through#disclaimer" target="_blank" rel="noopener">
      Proof of concept · not supported by ThoughtSpot Support
    </a>
  </header>
  <main>
    <!-- The solution's markup: breadcrumb, then the embeds with the menu laid over them. -->
    <div class="chart-column">
      <nav class="crumbs" id="crumbs"></nav>
      <div id="stage">
        <div id="action-menu" class="action-menu" hidden></div>
      </div>
    </div>
    <!-- Demo only: filled by how-it-works.js. -->
    <aside>
      <h2>How it works</h2>
      <p>Each step lights up as it happens, with the data that was actually exchanged.</p>
      <ol class="steps" id="steps"></ol>
    </aside>
  </main>
</body>
</html>
